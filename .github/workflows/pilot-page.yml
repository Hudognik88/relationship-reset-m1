name: Pilot interest page — validate and publish

on:
  push:
    branches: [pilot-interest-20260929, m1-first-payment-20260925]
    paths: ['pilot.html', 'docs/PILOT_*.md', 'scripts/*pilot*.py', 'scripts/deploy_pilot.sh', 'scripts/deploy_beget_remote.py', 'tests/pilot_receiver_test.py', '.github/workflows/pilot-page.yml']
  pull_request:
    paths: ['pilot.html', 'docs/PILOT_*.md', 'scripts/*pilot*.py', 'scripts/deploy_pilot.sh', 'scripts/deploy_beget_remote.py', 'tests/pilot_receiver_test.py', '.github/workflows/pilot-page.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; same pinned action as Kotlin CI
        with:
          persist-credentials: false
      - name: Validate publication boundary and receiver upgrade
        run: |
          bash -n scripts/deploy_pilot.sh
          python3 tests/pilot_receiver_test.py
      - name: Validate standalone interest page and build review archive
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/package_pilot.py --release "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; official ref verified
        with:
          name: pilot-interest-review
          path: dist/pilot-interest-review.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    # Enable only AFTER the owner installs the reviewed receiver upgrade once.
    # Keep existing environment branch restrictions and the restricted SSH key.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/m1-first-payment-20260925' &&
      vars.BEGET_PILOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: beget-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Package exact validated commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/package_pilot.py --release "$RELEASE_SHA"
      - name: Publish only pilot.html through restricted SSH
        env:
          RELEASE_SHA: ${{ github.sha }}
          BEGET_SSH_HOST: ${{ secrets.BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ secrets.BEGET_SSH_USER }}
          BEGET_SSH_PORT: ${{ vars.BEGET_SSH_PORT }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          BEGET_SSH_KNOWN_HOSTS: ${{ secrets.BEGET_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy_pilot.sh dist/pilot-interest-review.zip "$RELEASE_SHA"
